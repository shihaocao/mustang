; PlatformIO Project Configuration File
; Each target in src/targets/ gets its own env; build with `pio run -e <env>`.

[platformio]
default_envs = mosfet-test

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:mosfet-test]
build_src_filter = +<targets/mosfet-test.cpp>

[env:pin-tester]
build_src_filter = +<targets/pin-tester.cpp>
